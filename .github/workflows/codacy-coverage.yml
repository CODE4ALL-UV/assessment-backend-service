name: Codacy Code Coverage

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # 1. Descargar el código del repositorio
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Configurar la versión de Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      # 3. Clonar repos hermanos requeridos por las pruebas
      - name: Checkout sibling services
        run: |
          git clone https://github.com/CODE4ALL-UV/neon-storage-backend-service ../neon-storage-backend-service
          git clone https://github.com/CODE4ALL-UV/course-content-backend-service ../course-content-backend-service
          git clone https://github.com/CODE4ALL-UV/user-management-backend-service ../user-management-backend-service

      # 4. Instalar dependencias
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt \
            -r ../neon-storage-backend-service/requirements.txt \
            -r ../course-content-backend-service/requirements.txt \
            -r ../user-management-backend-service/requirements.txt
          pip install pytest pytest-cov

      # 5. Ejecutar pruebas y generar el archivo coverage.xml
      - name: Run tests with coverage
        env:
          PYTHONPATH: ../neon-storage-backend-service:../course-content-backend-service:../user-management-backend-service
        run: |
          pytest tests --cov=. --cov-report=xml

      # 6. Enviar el reporte coverage.xml a Codacy usando el Token guardado
      - name: Run codacy-coverage-reporter
        uses: codacy/codacy-coverage-reporter-action@v1
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          coverage-reports: coverage.xml